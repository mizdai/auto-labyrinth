<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Auto Labyrinth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="viewWrap"><canvas id="view"></canvas></div>
    <div id="side">
      <canvas id="map"></canvas>
      <div id="info">
        <div id="infoFloor">―</div>
        <div id="infoName"></div>
        <div id="infoPos"></div>
        <div id="infoGold"></div>
        <div id="infoState"></div>
      </div>
    </div>
  </div>
  <div id="log"></div>
  <table id="party"><colgroup><col class="c-name"><col class="c-cls"><col class="c-lv"><col class="c-ac"><col class="c-hp"><col class="c-mp"><col class="c-st"></colgroup><thead><tr><th>名前</th><th>職</th><th>Lv</th><th>AC</th><th>HP</th><th>MP</th><th>状態</th></tr></thead><tbody></tbody></table>
  <div id="controls">
    <button id="btnPause">⏸</button>
    <button id="btnSpeed">×2</button>
    <button id="btnMap">地図</button>
    <button id="btnInfo">記録</button>
    <button id="btnSettings">設定</button>
  </div>
</div>

<div id="modal" class="hidden"><div id="modalBody"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
