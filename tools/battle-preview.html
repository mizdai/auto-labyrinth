<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦闘画面プレビュー</title>
<style>body{background:#111;color:#ccc;font:13px sans-serif;margin:8px} canvas{width:100%;max-width:480px;display:block;margin:0 0 10px;border:1px solid #445}</style>
</head><body>
<p>モンスターの大きさ確認用（開発用ページ）</p>
<div id="out"></div>
<script type="module">
import { drawBattle, preloadSprites } from '../src/render.js';
import { MONSTERS } from '../src/monsters.js';
const sets = [
  ['rat'], ['kobold'], ['orc'], ['troll'], ['elderdragon'],
  ['rat', 'kobold', 'orc'], ['spider', 'werewolf', 'minotaur'], ['abysslord', 'greaterdemon', 'lich'], ['rat', 'bat', 'slime', 'kobold'],
];
preloadSprites(Object.keys(MONSTERS));
setTimeout(() => {
  for (const s of sets) {
    const c = document.createElement('canvas');
    c.width = 780; c.height = 608;
    document.getElementById('out').appendChild(c);
    const game = { battle: { groups: s.map(id => ({ mon: MONSTERS[id], units: [{ hp: 1 }, { hp: 1 }] })) } };
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    drawBattle(ctx, game, c.width, c.height);
  }
}, 1500);
</script>
</body></html>
